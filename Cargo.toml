[package]
name = "algorithm-playground"
version = "0.1.0"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", default-features = false }
rapier3d = "0.36"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Used only by the optional native Chromium smoke test; not linked into the app/WASM.
[dev-dependencies]
base64 = "0.22"
serde_json = "1"
tempfile = "3"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
