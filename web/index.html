<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d14">
<title>Rust Algorithm Playground</title>
<link rel="icon" href="data:,">
<style>
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#090d14; color:#bce2e7; font:16px system-ui; }
canvas { display:block; width:100%; height:100%; touch-action:none; outline:none; }
#status { position:fixed; inset:0; display:grid; place-items:center; padding:24px; pointer-events:none; text-align:center; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="1" aria-label="Interactive 3D algorithm playground"></canvas>
<div id="status" role="status">Loading Rust Algorithm Playground…</div>
<script src="./mq_js_bundle.js"></script>
<script>
// Only the Macroquad loader and browser lifecycle/error handling live in JavaScript.
const status = document.getElementById('status');
const pageCanvas = document.getElementById('glcanvas');
let appFailed = false;
function fail(message) { appFailed = true; status.style.display = 'grid'; status.textContent = message; }
window.addEventListener('error', event => fail('Unable to start: ' + event.message));
window.addEventListener('unhandledrejection', event => fail('Unable to load WebAssembly: ' + event.reason));
pageCanvas.addEventListener('webglcontextlost', event => { event.preventDefault(); fail('Graphics context lost. Reload the page to restart.'); });
const reportError = console.error.bind(console);
console.error = (...args) => { reportError(...args); fail('Application error: ' + args.map(String).join(' ')); };
const probe = document.createElement('canvas');
if (!(probe.getContext('webgl') || probe.getContext('experimental-webgl'))) {
    fail('WebGL is unavailable. Enable hardware acceleration or use a WebGL-compatible browser.');
} else {
    // The local loader sets wasm_exports on successful instantiation.
    const availableLoader = typeof load === 'function' ? load : null;
    if (availableLoader) {
        load('./algorithm-playground.wasm');
        const waitForFrame = () => {
            if (appFailed) return;
            if (pageCanvas.width > 0 && typeof wasm_exports !== 'undefined' && wasm_exports) status.style.display = 'none';
            else requestAnimationFrame(waitForFrame);
        };
        requestAnimationFrame(waitForFrame);
    } else fail('Local Macroquad loader is missing.');
}
</script>
</body>
</html>
